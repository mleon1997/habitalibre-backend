name: HabitaLibre Meta Publisher

on:
  push:
    paths:
      - "meta-autopilot/ready/*.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: habitalibre-meta-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip meta-publisher]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
      META_PAGE_ID: "880545785145111"
      META_GRAPH_VERSION: "v26.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ingest media and publish due jobs
        id: publisher
        run: node scripts/habitalibre-meta-publisher.mjs

      - name: Persist queue state and receipts
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- meta-autopilot; then
            echo "Nothing to persist."
            exit 0
          fi
          git config user.name "HabitaLibre Autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add meta-autopilot
          git commit -m "chore: persist HabitaLibre Meta publisher state [skip meta-publisher]"
          git push
