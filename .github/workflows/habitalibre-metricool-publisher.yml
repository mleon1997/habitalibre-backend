name: HabitaLibre Metricool Publisher

on:
  push:
    paths:
      - "autopilot/ready/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: habitalibre-metricool-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
      METRICOOL_USER_ID: "5522469"
      METRICOOL_BLOG_ID: "7140882"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish READY jobs to Metricool
        run: node scripts/habitalibre-metricool-publisher.mjs

      - name: Persist SENT receipts
        shell: bash
        run: |
          if git diff --quiet -- autopilot/ready autopilot/sent; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "HabitaLibre Autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add autopilot/ready autopilot/sent
          git commit -m "chore: hand off HabitaLibre content to Metricool"
          git push
